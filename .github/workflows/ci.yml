name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じ ref の古い run は取り消す。まだ何も公開しないので、途中で止めても困らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (lint / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: 依存を入れる
        # --locked: uv.lock と pyproject.toml が食い違っていたら落とす。
        run: uv sync --locked

      - name: PDF を読む道具を入れる
        # ページ整形の測定（tests/test_pdfpages.py の実物テスト）が使う。
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-osd

      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q

  image:
    name: image (docker build)
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 公開はしない。Dockerfile が壊れていないことだけを確かめる。
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
