name: CI

# main と v* のタグへの push ではイメージを ghcr.io に公開する。PR ではビルドだけを確かめる。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# 同じ ref の古い run は、PR なら取り消す。公開する run は取り消さずに順番待ちにする。
# 後から来たコミットが最後に公開するので、待たせても `latest` は main の先頭を指す。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  python:
    name: python (lint / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: 依存を入れる
        # --locked: uv.lock と pyproject.toml が食い違っていたら落とす。
        run: uv sync --locked

      - name: PDF を読む道具を入れる
        # ページ整形の測定（tests/test_pdfpages.py の実物テスト）が使う。
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-osd

      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q

  image:
    name: image (docker build)
    # 公開する前にテストを通す。通らないものを配らない。
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: ghcr にログインする
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: タグを決める
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            # `latest` は main の先頭。版を固定したいときは `:sha-1234567` を使う。
            type=raw,value=latest,enable={{is_default_branch}}

      # amd64 だけを作る。配置先の TrueNAS SCALE は x86_64 が前提。
      - name: ビルドする（push のときは公開する）
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
