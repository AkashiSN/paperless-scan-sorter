[project]
name = "paperless-scan-sorter"
version = "0.0.0"
description = "Paperless-ngx に取り込んだスキャン書類を Claude Code で分類・命名する"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28,<1",
]

[project.scripts]
paperless-scan-sorter = "paperless_scan_sorter.__main__:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
# 道具も宣言する。書かないと `uv run ruff` が PATH 上の実行ファイルに解決し、
# 手元では通って CI で見つからない。ruff は版で指摘と整形が変わるので上限を切る。
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[tool.ruff]
line-length = 100
target-version = "py314"
# ruff は Markdown 内のコードブロックも整形する。docs/ は設計書の正本で、
# そこに載るコードは説明のための引用なので、整形の対象にしない。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "S"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# S105-S107 はリテラルの token / password を「ハードコードされた秘密」と見なす。
# テストのトークンは固定値でなければ検証できないので除く。
"tests/*" = ["S101", "S105", "S106", "S107", "ANN"]

# src レイアウトなので、明示しないと自前のパッケージがサードパーティ扱いになり
# import の並びが安定しない。
[tool.ruff.lint.isort]
known-first-party = ["paperless_scan_sorter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
